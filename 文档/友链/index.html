    <style>
        body {
            margin: 0; /* 去掉默认边距 */
            display: flex;
            flex-wrap: wrap; /* 允许换行 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            height: 100vh; /* 使内容垂直居中 */
            background-image: url('https://s21.ax1x.com/2025/03/07/pEtQah8.webp'); /* 设置网页背景 */
            background-size: cover; /* 背景图像覆盖整个页面 */
            background-position: center; /* 背景图像居中 */
            background-attachment: fixed; /* 背景固定 */
        }

        h1 {
            width: 100%; /* 使标题占据整行 */
            text-align: center; /* 标题居中 */
            margin-bottom: 10px; /* 标题与盒子之间的间距 */
            color: white; /* 将标题颜色改为白色 */
        }

        .box {
            width: 25%; /* 电脑版每个盒子占据25%宽度 */
            margin: 10px 1%; /* 上下间距设置为10px，左右间距为1% */
            height: 100px; /* 盒子的高度 */
            background-size: cover; /* 自动裁剪图片以覆盖整个盒子 */
            background-position: center; /* 背景图片居中 */
            border-radius: 15px; /* 圆角半径 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white; /* 文字颜色 */
            cursor: pointer; /* 鼠标悬停时显示手形光标 */
            transition: opacity 0.3s; /* 透明度过渡效果 */
        }

        .box:hover {
            opacity: 0.8; /* 悬停时的透明度变化 */
        }

        /* 新增按钮样式 */
        .transparent-button {
            position: absolute; /* 绝对定位 */
            top: 20px; /* 距离顶部20px */
            left: 20px; /* 距离左侧20px */
            background-color: rgba(0, 0, 0, 0); /* 半透明白色背景 */
            color: black; /* 按钮文字颜色 */
            border: 2px solid white; /* 白色边框 */
            border-radius: 10px; /* 圆角半径 */
            padding: 10px 20px; /* 内边距 */
            cursor: pointer; /* 鼠标悬停时显示手形光标 */
            font-size: 16px; /* 字体大小 */
            transition: background-color 0.3s; /* 背景颜色过渡效果 */
        }

        .transparent-button:hover {
            background-color: rgba(0, 0, 0, 0); /* 悬停时的背景颜色 */
        }

        /* 媒体查询：手机版样式 */
        @media (max-width: 768px) {
            body {
                background-image: url('https://s21.ax1x.com/2025/03/07/pEtQw9S.jpg'); /* 设置手机版背景 */
            }
            .box {
                width: 90%; /* 手机版每个盒子占据90%宽度 */
                margin: 5% auto; /* 上下间距，左右居中 */
            }
            .transparent-button {
                width: 25%; /* 手机版按钮宽度减小为50% */
                padding: 10px 0; /* 内边距调整 */
                left: 5%; /* 水平居中 */
            }
        }

        footer {
            width: 100%; /* 页脚占据整行 */
            text-align: center; /* 页脚文本居中 */
            margin-top: 1px; /* 页脚与内容之间的间距 */
            color: white; /* 将页脚颜色改为白色 */
        }

        p {
            width: 100%; /* 段落占据整行 */
            text-align: center; /* 段落文本居中 */
            color: white; /* 将段落颜色改为白色 */
            margin-top: 1px; /* 段落与盒子之间的间距 */
        }
    </style>
